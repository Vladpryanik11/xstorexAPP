name: iOS

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: Check localization keys
        run: node scripts/check-l10n.mjs

      - name: Install XcodeGen and xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Generate project
        run: xcodegen generate

      - name: Pick iPhone simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          data = json.load(sys.stdin)["devices"]
          candidates = []
          for runtime, devices in data.items():
              match = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not match:
                  continue
              version = (int(match.group(1)), int(match.group(2)))
              for device in devices:
                  if device.get("isAvailable", True) and device["name"].startswith("iPhone"):
                      candidates.append((version, device["name"], device["udid"]))
          candidates.sort()
          print(candidates[-1][2] if candidates else "")
          ')
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project iStore.xcodeproj \
            -scheme iStore \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log \
            | xcbeautify --renderer github-actions

      # Логи Actions видны только после входа в GitHub, а аннотации отдаются публичным API.
      # Поэтому ошибки компиляции и упавшие тесты дублируются аннотациями по 8 строк.
      - name: Report build errors as annotations
        if: failure()
        run: |
          [ -f xcodebuild.log ] || exit 0
          grep -E "error:|\*\* (BUILD|TEST) FAILED|Testing failed|' failed \(|XCTAssert" xcodebuild.log \
            | sed 's|.*/ios/||' | awk '!seen[$0]++' | head -40 > errors.txt || true
          split -l 8 errors.txt chunk_
          for f in chunk_*; do
            [ -f "$f" ] || continue
            msg=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=xcodebuild::${msg}"
          done

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            ios/TestResults.xcresult
            ios/xcodebuild.log
          if-no-files-found: ignore
