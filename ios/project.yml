name: iStore

options:
  bundleIdPrefix: com.istore
  developmentLanguage: en
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"

targets:
  iStore:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: iStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.istore.app
        PRODUCT_NAME: iStore
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
      configs:
        Debug:
          ISTORE_API_BASE_URL: "http://localhost:8080"
          # Окружение APNs: сборка из Xcode — development (sandbox), Ad Hoc и Enterprise — production.
          APS_ENVIRONMENT: development
        Release:
          ISTORE_API_BASE_URL: "https://api.istore.example"
          APS_ENVIRONMENT: production
          STRIP_STYLE: all
          DEPLOYMENT_POSTPROCESSING: YES
    entitlements:
      path: iStore/iStore.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
    info:
      path: iStore/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: iStore
        CFBundleName: $(PRODUCT_NAME)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations:
          - en
          - ru
        CFBundleURLTypes:
          - CFBundleURLName: com.istore.app
            CFBundleURLSchemes:
              - istore
        LSRequiresIPhoneOS: true
        IStoreAPIBaseURL: $(ISTORE_API_BASE_URL)
        IStoreAPSEnvironment: $(APS_ENVIRONMENT)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    scheme:
      testTargets:
        - iStoreTests
      gatherCoverageData: false

  iStoreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: iStoreTests
    dependencies:
      - target: iStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.istore.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/iStore.app/iStore
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
